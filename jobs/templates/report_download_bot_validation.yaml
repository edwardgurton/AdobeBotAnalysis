job_type: report_download
client: Legend
description: "Bot validation report download driven by a bot rules list"

report_group: bot_validation

rsids:
  source: file
  file: data/rsid_lists/legend_validation.txt
  batch_size: 12

# Standalone report_download jobs don't run transforms from this config (transform:
# below is a no-op here — run `adobe-downloader transform` separately, or use a
# composite job instead). That also means bot_rules: isn't wired up for this job
# type — segments: is the only field that actually drives the download/filenames.
segments:
  source: segment_list_file
  file: data/segment_lists/Legend/<segment-list>.json

interval: month

date_range:
  from: "2025-01-01"
  to: "2025-03-31"

transform:
  enabled: true
  type: bot_validation
  concat: true

resume: true

output:
  base_folder: "/Users/edwardgurton/Documents/Work/Adobe Downloads"
