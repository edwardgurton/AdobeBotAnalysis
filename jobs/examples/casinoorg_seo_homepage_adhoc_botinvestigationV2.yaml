job_type: composite
client: Legend
description: "Single bot investigation for Casino.org SEO homepage visits — download + validate + transform"

date_range:
  from: "2026-03-31"
  to: "2026-06-30"

output:
  base_folder: "C:/Adobe_Downloads"
  job_name: "BotInvCORGSEONL"

steps:
  - step: report_download
    id: download_investigation_daily
    report_group: bot_investigation
    rsids:
      source: single
      single: Casinoorg
    segments:
      source: inline
      ids:
        - s3938_6a42a053b08bc61633d6f4a9
    interval: day
    resume: true
    file_name_extra: "BotInvCORGSEONL-Daily"

  - step: report_download
    id: download_investigation_totals
    report_group: bot_investigation
    rsids:
      source: single
      single: Casinoorg
    segments:
      source: inline
      ids:
        - s3938_6a42a053b08bc61633d6f4a9
    interval: full
    resume: true
    file_name_extra: "BotInvCORGSEONL-Totals"

  - step: validate_output
    id: validate_daily
    depends_on: download_investigation_daily
    config_ref: download_investigation_daily
    retry: true

  - step: validate_output
    id: validate_totals
    depends_on: download_investigation_totals
    config_ref: download_investigation_totals
    retry: true

  - step: transform_concat
    id: transform_daily
    depends_on: validate_daily
    transform:
      type: bot_investigation
      source_pattern: "*Daily*.json"
      split_by_rsid: true
    concat:
      file_name_extra: "Daily"
      custom_headers:
        1: "feature"

  - step: transform_concat
    id: transform_day_totals
    depends_on: validate_totals
    transform:
      type: bot_investigation
      source_pattern: "*ByDay*Totals*.json"
    concat:
      file_name_extra: "AllInvestigationsMetricsPerDay"
      custom_headers:
        1: "feature"

  - step: transform_concat
    id: transform_feature_totals
    depends_on: validate_totals
    transform:
      type: bot_investigation
      source_pattern: "^(?!.*ByDay).*Totals.*\\.json$"
    concat:
      file_name_extra: "AllInvestigationsMetricsPerFeature"
      custom_headers:
        1: "feature"