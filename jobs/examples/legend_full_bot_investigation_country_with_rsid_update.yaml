job_type: composite
client: Legend
description: "Full Legend bot investigation pipeline (RSID×country) — refresh RSIDs, matrix + download + validate + transform"

date_range:
  from: "2026-03-01"
  to: "2026-06-30"

output:
  base_folder: "C:/Adobe_Downloads"
  job_name: "BotInvCountry26Q2V1"

steps:
  # Refresh the RSID lists from live report-suite topline metrics before the
  # matrix step runs, so generate_country_matrix always sees current visit
  # counts rather than a stale file. Writes to
  # data/rsid_lists/botInvestigationMinThresholdVisits.txt (and the validation
  # list), matching the thresholds used in jobs/examples/legend_rsid_update.yaml.
  - step: rsid_update
    id: update_rsids
    rsid_update:
      investigation_threshold: 1000
      validation_threshold: 1000
      include_virtual: false
    output:
      base_folder: data/rsid_lists/

  # Visits-by-country for every RSID in scope (SegmentsBuilderCountry50), kept
  # where visits > visit_threshold. Reuses a country segment from
  # data/country_segment_lookup.json when one already exists for that country,
  # otherwise creates it via the API and appends it to the lookup so later
  # jobs (any RSID) reuse it too instead of creating a duplicate.
  # rsids.file is the same path update_rsids just (re)wrote above.
  - step: generate_country_matrix
    id: matrix
    depends_on: update_rsids
    rsids:
      source: file
      file: data\rsid_lists\botInvestigationMinThresholdVisits.txt
      batch_size: 12
    visit_threshold: 100000
    # share_with_users:
    #   - "200419062"

  # One full bot_investigation download per (rsid, country) pair — e.g.
  # CasinoOrg-UnitedKingdom, CasinoOrg-UnitedStates — not a cross product of
  # every RSID against every country.
  - step: country_investigation
    id: download_investigation_daily
    matrix:
      source: step_output
      step_id: matrix
      output_key: matrix_file
    interval: day
    investigation_label: "FullRun-FY26Q2V1"
    file_name_extra: "Daily"

  - step: country_investigation
    id: download_investigation_totals
    matrix:
      source: step_output
      step_id: matrix
      output_key: matrix_file
    interval: full
    investigation_label: "FullRun-FY26Q2V1"
    file_name_extra: "Totals"

  - step: validate_output
    id: validate_daily
    depends_on: download_investigation_daily
    config_ref: download_investigation_daily
    retry: true

  - step: validate_output
    id: validate_totals
    depends_on: download_investigation_totals
    config_ref: download_investigation_totals
    retry: true

  # One CSV per RSID×country pair (CasinoOrg-UnitedKingdom.csv, CasinoOrg-UnitedStates.csv, ...)
  - step: transform_concat
    id: transform_daily
    depends_on: validate_daily
    transform:
      type: bot_investigation
      source_pattern: "*Daily*.json"
      split_by_rsid_country: true
    concat:
      file_name_extra: "Daily"
      custom_headers:
        1: "feature"

  # Totals stay as one file across every RSID×country combo — used to compare
  # a feature (e.g. browsers) across all sites, same as the plain per-RSID
  # investigation. RSID and country are still identifiable per row via the
  # fileName column.
  - step: transform_concat
    id: transform_day_totals
    depends_on: validate_totals
    transform:
      type: bot_investigation
      source_pattern: "*ByDay*Totals*.json"
    concat:
      file_name_extra: "AllInvestigationsMetricsPerDay"
      custom_headers:
        1: "feature"

  - step: transform_concat
    id: transform_feature_totals
    depends_on: validate_totals
    transform:
      type: bot_investigation
      source_pattern: "^(?!.*ByDay).*Totals.*\\.json$"
    concat:
      file_name_extra: "AllInvestigationsMetricsPerFeature"
      custom_headers:
        1: "feature"
